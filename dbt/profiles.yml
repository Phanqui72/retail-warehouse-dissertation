# Kết nối dbt -> Trino. Mọi giá trị đọc từ biến môi trường (config/settings.env), không có giá trị mặc định.
vnb_lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none                                   # Trino trong docker không bật xác thực
      http_scheme: http
      host: "{{ env_var('DBT_TRINO_HOST') }}"
      port: "{{ env_var('DBT_TRINO_PORT') | as_number }}"
      user: "{{ env_var('DBT_TRINO_USER') }}"
      database: "{{ env_var('TRINO_CATALOG') }}"     # catalog Trino = Iceberg REST
      schema: "{{ env_var('GOLD_NAMESPACE') }}"      # namespace đích của Gold
      threads: "{{ env_var('DBT_THREADS') | as_number }}"
