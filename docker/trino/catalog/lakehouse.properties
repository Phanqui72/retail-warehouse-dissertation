# Catalog "lakehouse" trong Trino = Iceberg REST catalog + file trên MinIO.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_REST_URI}
iceberg.rest-catalog.warehouse=s3://${ENV:LAKEHOUSE_BUCKET}/
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# bảo trì (expire snapshots, xóa file mồ côi) với retention ngắn cho demo — tên property dùng dấu gạch dưới
iceberg.expire_snapshots.min-retention=10m
iceberg.remove_orphan_files.min-retention=10m
# đọc/ghi S3 bằng filesystem native của Trino
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=${ENV:CATALOG_S3_PATH__STYLE__ACCESS}
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}