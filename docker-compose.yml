# VNB Lakehouse (batch) — hạ tầng tối thiểu: Postgres · MinIO · Iceberg REST · Trino · Spark
# Tham số ứng dụng: config/settings.env   ·   Bí mật: .env (không commit)
# File này chỉ khai báo HẠ TẦNG (image, cổng, volume, RAM); mọi tham số khác đọc từ 2 file trên.
# Lưu ý: trong lệnh shell của compose, "$$X" = biến X của container (compose không tự thay).
name: vnb_lakehouse

x-env: &env
  env_file: [./config/settings.env, ./.env]

services:
  # ---------------------------------------------------------------- (B3) metadata DB
  postgres:
    image: postgres:16.4
    <<: *env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  postgres-init:
    image: postgres:16.4
    <<: *env
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        for db in "$$ICEBERG_CATALOG_DB" "$$AIRFLOW_DB"; do
          exists=$$(psql -h "$$POSTGRES_HOST" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$db'")
          if [ "$$exists" = "1" ]; then
            echo "[postgres-init] database $$db đã có"
          else
            psql -h "$$POSTGRES_HOST" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$$db\"" && echo "[postgres-init] đã tạo database $$db"
          fi
        done
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  # ---------------------------------------------------------------- (B4) object storage
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    <<: *env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
    mem_limit: 384m
    restart: unless-stopped

  minio-init:
    build: {context: ., dockerfile: docker/tools/Dockerfile}
    image: vnb/tools:0.1
    <<: *env
    command: ["python", "/app/scripts/init_buckets.py"]
    volumes: ["./scripts:/app/scripts:ro"]
    depends_on: {minio: {condition: service_started}}
    restart: "no"

  # ---------------------------------------------------------------- (B5) Iceberg REST catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    <<: *env
    # image chỉ hiểu biến CATALOG_* / AWS_* -> ghép chúng từ settings.env + .env rồi chạy chương trình gốc
    command:
      - sh
      - -c
      - |
        export CATALOG_URI="jdbc:postgresql://$$POSTGRES_HOST:$$POSTGRES_PORT/$$ICEBERG_CATALOG_DB"
        export CATALOG_JDBC_USER="$$POSTGRES_USER"
        export CATALOG_JDBC_PASSWORD="$$POSTGRES_PASSWORD"
        export CATALOG_WAREHOUSE="s3://$$LAKEHOUSE_BUCKET/"
        export CATALOG_S3_ENDPOINT="$$S3_ENDPOINT"
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"
        export JAVA_TOOL_OPTIONS="-Xmx$$ICEBERG_REST_HEAP"
        exec java -jar iceberg-rest-image-all.jar
    ports: ["8181:8181"]
    depends_on:
      postgres-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    mem_limit: 384m
    restart: unless-stopped
  # ---------------------------------------------------------------- (B6) SQL engine
  trino:
    image: trinodb/trino:460
    <<: *env
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
    ports: ["8090:8080"]
    depends_on: {iceberg-rest: {condition: service_started}}
    mem_limit: 1300m
    restart: unless-stopped
  # ---------------------------------------------------------------- (B7) Spark — chạy theo lệnh, không chạy nền
  spark:
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    image: vnb/spark:3.5.3-iceberg1.6.1
    <<: *env
    # master / RAM lấy từ settings.env; phần sau "docker compose run --rm spark" được truyền vào "$$@"
    entrypoint:
      - sh
      - -c
      - exec /opt/spark/bin/spark-submit --master "$$SPARK_MASTER" --driver-memory "$$SPARK_DRIVER_MEMORY" "$$@"
      - spark-submit
    volumes:
      - ./jobs:/opt/jobs:ro
    ports: ["4041:4040"]
    depends_on:
      iceberg-rest: {condition: service_started}
    mem_limit: 2200m
    profiles: ["jobs"]
    restart: "no"


volumes:
  pg_data:
  minio_data: