# VNB Lakehouse (batch) — hạ tầng tối thiểu: Postgres · MinIO · Iceberg REST · Trino · Spark
# Hằng số: config/settings.env   ·   Bí mật: .env (không commit)
name: vnb_lakehouse

# Anchor YML to reference: &env to include env_file in multiple services
x-env: &env
  env_file: [./config/settings.env, ./.env]

services:
  # ---------------------------------------------------------------- (B3) metadata DB
  postgres:
    image: postgres:16.4
    <<: *env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pg_data:
  minio_data: